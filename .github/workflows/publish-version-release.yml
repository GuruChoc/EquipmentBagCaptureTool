name: Publish VERSION release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          if [[ -z "$VERSION" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build exact release archive
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_stage
          cp \
            EquipmentBagCaptureTool.ahk \
            EquipmentBagCaptureCalibration.ahk \
            Position_Maple_For_Capture.ahk \
            Check_Screenshot_Folder_CRC.bat \
            README.md \
            CHANGELOG.md \
            LICENSE \
            VERSION \
            release_stage/
          (cd release_stage && zip -q -r "../EquipmentBagCaptureTool_${VERSION}.zip" .)
          sha256sum "EquipmentBagCaptureTool_${VERSION}.zip" > SHA256SUMS.txt

      - name: Write release notes
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<EOF
          # Equipment Bag Capture Tool ${VERSION}

          Stable release of the tested Maple equipment-bag capture workflow.

          Highlights:
          - 850 ms ShareX post-capture wait
          - alternating 576 / 577 px movement preserved
          - physical mouse-movement lock
          - live capture/movement counter
          - Esc safe stop with persistent checkpoint
          - F9 resume
          - post-movement first-item settle/reclick recovery
          - calibrated Maple window position/size safety check
          - calibrated display DPI/scaling safety check
          - automatic and standalone Maple reposition helper
          - screenshot CRC32 validation helper

          Local calibration, checkpoints, logs and screenshots are intentionally excluded from the release archive.

          SHA-256 is supplied as a separate release asset.
          EOF

      - name: Create tag, GitHub Release and assets
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            "EquipmentBagCaptureTool_${VERSION}.zip" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Equipment Bag Capture Tool ${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag=false
